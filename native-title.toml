schema = "xboxllr.native-title.v1"

[title]
id = "jsrf-ntsc-u"
name = "Jet Set Radio Future"
game_id = "5345000A"
region = "NTSC-U"
executable = "JSRFRecomp"
xbe_sha256 = "f4441696fdd007c31a712815cdde967836fbc3ab97fcb2f58e1db56974644219"

[launcher]
sharp_presentation = true
ui_revision = "ccc186e097b362555292b157ffd303abcea26fbf"
# Added after original gameplay scope/timing observations; never just uncap.
frame_modes = ["interpolated"]

[launcher.defaults."jsrf.enhancement.widescreen/widescreen"]
enabled = true
options = { aspect = "adaptive" }

[launcher.defaults."xboxlle.enhancement.visuals/resolution"]
enabled = true
options = { height = "1080" }

[launcher.defaults."xboxlle.enhancement.visuals/supersampling"]
enabled = true
options = { axis = "2" }

[launcher.defaults."xboxlle.enhancement.visuals/antialiasing"]
enabled = true
options = { method = "fxaa" }

[launcher.defaults."xboxlle.enhancement.visuals/filtering"]
enabled = true
options = { anisotropy = "8" }

[launcher.defaults."xboxlle.enhancement.frame-rate/frame-rate"]
enabled = false
options = { mode = "original", rate = "60" }

[launcher.defaults."jsrf.enhancement.test-runs/early-unlock"]
enabled = true

[launcher.defaults."xboxllr.diagnostics/session-replay"]
enabled = true

[launcher.defaults."jsrf.enhancement.seamless/seamless-loading"]
enabled = true

[mods]
registry = "src/mods/visuals.c"
inputs = ["src/mods/revision.h", "config/revisions/ntsc-u/visuals.json", "src/mods/boost.inc", "src/mods/seamless.inc", "src/mods/challenge_unlock.inc", "config/revisions/ntsc-u/challenge-unlock.json"]
widescreen_manifest = "mods/preloaded/packages/jsrf.enhancement.widescreen/1.0.0/manifest.toml"
widescreen_package = "jsrf.enhancement.widescreen"
widescreen_plugin = "jsrf.widescreen"
switches = [{ manifest = "mods/preloaded/packages/jsrf.enhancement.test-runs/1.0.0/manifest.toml", package = "jsrf.enhancement.test-runs", feature = "early-unlock", key = "EARLY_TEST_RUNS" }, { manifest = "mods/preloaded/packages/jsrf.enhancement.seamless/1.0.0/manifest.toml", package = "jsrf.enhancement.seamless", feature = "seamless-loading", key = "SEAMLESS_LOADING" }]

[content]
image = "default.xbe"
device = '\Device\Cdrom0'
drive = "D:"
drive_owner = "HOST"

[generation]
profile = "config/revisions/ntsc-u/profile.json"
bindings = ["cache", "input", "d3d", "audio", "title"]
unit_max_functions = 64
unit_max_bytes = 524288

[build]
PILOT_NATIVE_OPTIMIZATION = "OPTIMIZED"
PILOT_MEDIA = "HOST"
PILOT_CACHE = "NATIVE"
PILOT_CPU_PROBE = "ORIGINAL"
PILOT_RENDERER = "D3D11"
PILOT_D3D_DONOR = "PHOBOS"
PILOT_AUDIO = "NATIVE"
PILOT_AUDIO_BACKEND = "XAUDIO2_DSP"
PILOT_CALENDAR = "HLE"
PILOT_IO_DEVICE = "OFF"
PILOT_USB = "OFF"
PILOT_DISPLAY = "NATIVE"
PILOT_MEMORY = "NATIVE"
PILOT_FILES = "NATIVE"
PILOT_INPUT = "NATIVE"
PILOT_SCHEDULING = "NATIVE"

[runtime]
XLLE_PILOT_GUEST_SCHEDULER = "1"
XLLE_PILOT_DEFER_STREAM_UPLOAD = "1"
XLLE_PILOT_TEXTURE_EXPOSURE_CACHE = "1"
XLLE_PILOT_GPU_EVENTS = "1"
XLLE_PILOT_EVENT_TRACE = "0"
XLLE_PILOT_TRACE = "0"

[revisions.usa-standalone]
definition = "native-title-usa.toml"
